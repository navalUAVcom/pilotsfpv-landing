<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pilots FPV — Global FPV Directory & Community Waitlist</title>
  <meta name="description" content="Join the global FPV platform connecting pilots, industry, cinema, and autonomous hardware. Sign up for early access.">
  <link rel="canonical" href="https://pilotsfpv.com/">
  
  <!-- Hreflang SEO architektura pro 10 jazyků -->
  <link rel="alternate" hreflang="x-default" href="https://pilotsfpv.com/" />
  <link rel="alternate" hreflang="en" href="https://pilotsfpv.com/" />
  <link rel="alternate" hreflang="zh" href="https://pilotsfpv.com/zh/" />
  <link rel="alternate" hreflang="es" href="https://pilotsfpv.com/es/" />
  <link rel="alternate" hreflang="de" href="https://pilotsfpv.com/de/" />
  <link rel="alternate" hreflang="fr" href="https://pilotsfpv.com/fr/" />
  <link rel="alternate" hreflang="it" href="https://pilotsfpv.com/it/" />
  <link rel="alternate" hreflang="ja" href="https://pilotsfpv.com/ja/" />
  <link rel="alternate" hreflang="pt" href="https://pilotsfpv.com/pt/" />
  <link rel="alternate" hreflang="pl" href="https://pilotsfpv.com/pl/" />
  <link rel="alternate" hreflang="cs" href="https://pilotsfpv.com/cs/" />

  <!-- Open Graph -->
  <meta property="og:title" content="Pilots FPV — Global FPV Platform">
  <meta property="og:description" content="Connecting FPV pilots, industrial applications, cinematographers, and security hardware worldwide.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pilotsfpv.com/">

  <style>
    :root {
      --bg: #121214;
      --card-bg: #1a1a1e;
      --border: #2a2a30;
      --text: #ffffff;
      --text-muted: #a0a0a5;
      --accent: #00FF88;
      --accent-glow: rgba(0, 255, 136, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 1rem;
    }

    header {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 2rem;
    }

    .logo {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--text);
    }
    .logo span { color: var(--accent); }

    .lang-select {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    main {
      max-width: 680px;
      width: 100%;
      text-align: center;
      margin: auto 0;
    }

    .badge {
      display: inline-block;
      background: var(--accent-glow);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 0.35rem 0.9rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 1.2rem;
    }

    p.lead {
      color: var(--text-muted);
      font-size: 1.15rem;
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }

    .form-wrapper {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      margin-bottom: 2rem;
    }

    footer {
      width: 100%;
      max-width: 800px;
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.85rem;
      text-align: center;
      line-height: 1.6;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <header>
    <div class="logo">PILOTS <span>FPV</span></div>
    <select class="lang-select" onchange="if(this.value) window.location.href=this.value;">
      <option value="/" selected>🇬🇧 English</option>
      <option value="/zh/">🇨🇳 中文</option>
      <option value="/es/">🇪🇸 Español</option>
      <option value="/de/">🇩🇪 Deutsch</option>
      <option value="/fr/">🇫🇷 Français</option>
      <option value="/it/">🇮🇹 Italiano</option>
      <option value="/ja/">🇯🇵 日本語</option>
      <option value="/pt/">🇵🇹 Português</option>
      <option value="/pl/">🇵🇱 Polski</option>
      <option value="/cs/">🇨🇿 Čeština</option>
    </select>
  </header>

  <main>
    <span class="badge">Global Waitlist</span>
    <h1>The International Home for FPV Pilots</h1>
    <p class="lead">
      Building the global directory and network connecting professional FPV pilots across film, industry, security, and autonomous hardware.
    </p>

    <div class="form-wrapper">
      <!-- SEM VLOŽTE KÓD FORMULÁŘE Z MAILERLITE -->
      <p style="color: var(--text-muted);">Místo pro formulář MailerLite</p>
    </div>
  </main>

  <footer>
    <p>Za projektem stojí a provozuje <a href="https://fpvvideo.cz" target="_blank" rel="noopener">fpvvideo.cz</a></p>
  </footer>

</body>
</html>
